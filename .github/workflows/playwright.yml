# ==============================================================================
# GitHub Actions CI Workflow: AWH Hospital E2E & API Test Automation
# Description: Triggers on push, PRs to main/master, and daily nightly cron schedule.
# Steps: Checks out repo, installs dependencies & Playwright browsers, runs tests,
#        generates Allure reports with email notifications, and uploads report artifacts.
# ==============================================================================

name: AWH Hospital Playwright E2E Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *' # Run every day at 2 AM

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CI: true
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 465
      SMTP_SECURE: true
      SEND_EMAIL_REPORT: true
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: 18
        
    - name: Install dependencies
      run: npm install
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests
      run: npm run test
      continue-on-error: true
      
    - name: Generate Allure Report (Includes History/Executor/Email)
      if: always()
      run: npm run report:generate
      
    - name: Upload Allure Report as Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

